<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hisaab — Shop ledger</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 class="brand-name">Hisaab</h1>
      <p class="brand-sub">Shop ledger</p>
    </div>
    <div class="lang">
      <label for="lang-switch" class="visually-hidden">Language</label>
      <select id="lang-switch" name="language">
        <option value="en" selected>English</option>
        <option value="hi">हिंदी</option>
        <option value="te">తెలుగు</option>
      </select>
    </div>
  </header>

  <main class="wrap">
    <section class="card hero" aria-labelledby="total-label">
      <p class="label" id="total-label">Total outstanding (Rs)</p>
      <div class="total-row">
        <div id="total-outstanding" class="total" data-value="0">0</div>
        <span class="human total-human">Rs 0</span>
      </div>
    </section>

    <section class="card search-bar" aria-label="Search customers">
      <label for="search" class="visually-hidden">Search name or phone</label>
      <input id="search" type="search" placeholder="Search name or phone" autocomplete="off" spellcheck="false">
    </section>

    <section id="overdue" class="card" aria-labelledby="overdue-title">
      <h2 class="section-title" id="overdue-title">Overdue (30+ days)</h2>
      <p class="empty small">No customers overdue right now.</p>
    </section>

    <section class="card" aria-labelledby="customers-title">
      <h2 class="section-title" id="customers-title">Customers</h2>
      <div id="customers" class="customers">
        <p class="empty" id="customers-empty">No customers yet. Add one, or import a shop file.</p>
      </div>
    </section>

    <section class="card" aria-labelledby="new-customer-title">
      <h2 class="section-title" id="new-customer-title">Add customer</h2>
      <form id="new-customer" novalidate>
        <div class="field">
          <label for="new-name">Name</label>
          <input id="new-name" name="name" type="text" autocomplete="off" placeholder="Full name">
        </div>
        <div class="field">
          <label for="new-phone">Phone</label>
          <input id="new-phone" name="phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="10-digit phone">
        </div>
        <div class="row-actions">
          <button id="add-customer" type="button" class="btn primary">Add customer</button>
        </div>
        <p class="msg" id="new-customer-msg" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card" aria-labelledby="entry-title">
      <h2 class="section-title" id="entry-title">Add entry</h2>
      <form id="entry-form" novalidate>
        <div class="field">
          <label for="entry-type">Type</label>
          <select id="entry-type" name="type">
            <option value="credit" selected>Credit</option>
            <option value="payment">Payment</option>
          </select>
        </div>
        <div class="field">
          <label for="entry-amount">Amount (Rs)</label>
          <input id="entry-amount" name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        </div>
        <div class="field">
          <label for="entry-date">Date</label>
          <input id="entry-date" name="date" type="date">
        </div>
        <div class="field">
          <label for="entry-note">Note</label>
          <input id="entry-note" name="note" type="text" autocomplete="off" placeholder="Optional note">
        </div>
        <div class="field">
          <label for="shot-input">Payment screenshot</label>
          <input id="shot-input" name="shot" type="file" accept="image/*">
        </div>
        <div class="row-actions">
          <button id="entry-save" type="submit" class="btn primary">Save</button>
        </div>
        <p class="msg" id="entry-msg" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card" aria-labelledby="import-title">
      <h2 class="section-title" id="import-title">Import shop JSON</h2>
      <form class="import-form" novalidate>
        <div class="field">
          <label for="import-box">Paste shop JSON</label>
          <textarea id="import-box" placeholder="Paste shop JSON" spellcheck="false"></textarea>
        </div>
        <div class="row-actions">
          <button id="import-go" type="button" class="btn primary">Import</button>
          <button id="export-csv" type="button" class="btn">Export CSV</button>
        </div>
        <p id="import-msg" class="msg" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
